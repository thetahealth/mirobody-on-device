<!DOCTYPE html>
<html>
<!-- Offscreen render host: MathJax (LaTeX -> SVG text) and ECharts (option -> PNG
     data URL). Loaded into ONE hidden QWebEnginePage (renderhost.cpp); never shown
     and never navigated anywhere else. C++ calls window.renderTex / window.renderChart
     via runJavaScript, gets a JSON string back, writes the payload to the render
     cache, and the chat UI draws a plain QML Image -- the message list itself never
     hosts a web view.

     A sibling of harmony's resources/rawfile/render/render.html, and it loads the very
     same libraries (see qt/CMakeLists.txt, which reads them out of that directory
     rather than keeping a second copy). It differs in two ways only:

       - no colour-mode parameter. This client has one scheme (Theme.qml is the light
         Material 3 palette the web client and Android share), so the surface and ink
         are constants here instead of arguments.
       - a `mbReady` flag. ArkWeb's onPageEnd fires late enough that harmony can queue
         straight away; a QWebEnginePage's loadFinished does not wait for MathJax's own
         asynchronous startup, so the C++ side polls this before the first job. -->
<head>
  <meta charset="utf-8">
  <script>
    window.mbReady = false;
    window.MathJax = {
      startup: {
        typeset: false,
        ready: function () {
          MathJax.startup.defaultReady();
          MathJax.startup.promise.then(function () { window.mbReady = true; });
        }
      },
      svg: { fontCache: 'local' }
    };
  </script>
  <script src="tex-svg.js"></script>
  <script src="echarts.min.js"></script>
  <script src="chart-theme.js"></script>
  <script>
    // 1ex -> px at the SVG's default 16px math font. Theme.baseSize scales the drawn
    // image on the QML side, so this is the unscaled baseline.
    var EX_PX = 8.0;

    // Mirrors of Theme.qml, which mirrors htdoc/src/config.js `color`. Duplicated
    // across the C++<->JS boundary because the page cannot read the QML singleton;
    // keep the two in step when either palette changes.
    var INK      = '#2a2e36';   // formula glyphs (code ink)
    var CHART_BG = '#f2efe9';   // Theme.background -- what a reply sits on
    var TEXT     = '#1a1c1e';   // Theme.surfaceFg
    var TEXT_DIM = '#52565c';   // Theme.surfaceVarFg
    var AXIS     = '#c9c2b4';
    var GRID     = '#ddd6c9';   // Theme.outlineVar

    function palette() {
      return { ink: TEXT, inkDim: TEXT_DIM, axis: AXIS, grid: GRID, surface: CHART_BG };
    }

    // tex -> {ok, svg, w, h} (JSON string). display=true for $$ blocks. The SVG
    // travels as TEXT: the C++ side writes it to a file and QML draws that, which
    // keeps the formula resolution-independent.
    window.renderTex = function (tex, display) {
      try {
        var node = MathJax.tex2svg(tex, { display: !!display });
        var svg = node.querySelector('svg');
        if (!svg) { return JSON.stringify({ ok: false }); }
        // MathJax fills glyphs with `currentColor`. A standalone SVG file inherits no
        // colour, so it would resolve to black; pin it to the theme's code ink.
        svg.style.color = INK;
        var w = Math.ceil(parseFloat(svg.getAttribute('width')) * EX_PX);
        var h = Math.ceil(parseFloat(svg.getAttribute('height')) * EX_PX);
        var xml = new XMLSerializer().serializeToString(svg);
        // MathJax accumulates a per-document font cache; reset it so one bad formula
        // cannot poison later ones.
        MathJax.startup.document.clear();
        return JSON.stringify({ ok: true, svg: xml, w: w, h: h });
      } catch (e) {
        return JSON.stringify({ ok: false, err: String(e).substring(0, 120) });
      }
    };

    // ECharts option JSON -> {ok, png (base64, no prefix), w, h}. A fixed logical
    // canvas at 2x pixel ratio: the UI letterboxes to the reply width, so the exact
    // size only affects sharpness.
    var CHART_W = 640, CHART_H = 400;

    // Themes and option sanitising live in chart-theme.js, shared with the harmony,
    // Android and iOS chart hosts. This host is the odd one out in one respect only:
    // it bakes a PNG, which has no alpha, so it passes the opaque page colour as the
    // surface rather than 'transparent'.
    window.renderChart = function (optionJson) {
      var el = document.createElement('div');
      document.body.appendChild(el);
      var chart = null;
      try {
        var option = mbPrepare(JSON.parse(optionJson));
        option.animation = false;   // a static image cannot animate
        chart = echarts.init(el, mbChartTheme(false, palette()),
          { width: CHART_W, height: CHART_H, devicePixelRatio: 2 });
        chart.setOption(option);
        var url = chart.getDataURL({ type: 'png', pixelRatio: 2, backgroundColor: CHART_BG });
        return JSON.stringify({
          ok: true,
          png: url.substring('data:image/png;base64,'.length),
          w: CHART_W,
          h: CHART_H
        });
      } catch (e) {
        return JSON.stringify({ ok: false, err: String(e).substring(0, 120) });
      } finally {
        if (chart) { chart.dispose(); }
        document.body.removeChild(el);
      }
    };
  </script>
</head>
<body></body>
</html>
