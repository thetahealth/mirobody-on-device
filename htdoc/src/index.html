<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- The app may be served under a URI prefix (HTTP_URI_PREFIX, e.g.
         "/mirobody"). The server redirects "/prefix" -> "/prefix/", so the page
         loads at the mount root and the browser resolves these relative asset
         URLs under it natively -- no <base> tag needed. API calls are prefixed
         in JS (net.appBase(), derived from window.location); that logic lives in
         the bundle, not an inline script, because the page CSP (script-src
         'self') blocks inline scripts. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Mirobody: sign in and chat through the on-device server." />
    <meta name="theme-color" content="#1e3a6b" />

    <title>Mirobody</title>
    <style>
      /* Brand title is hidden by default and revealed once the viewport is
         at least 600px wide. */
      .brand-title { display: none; }
      @media (min-width: 600px) {
        .brand-title { display: inline; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
