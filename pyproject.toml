[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.12", "setuptools-scm>=8"]
build-backend = "scikit_build_core.build"

[project]
name = "mirobody"
# Version is derived from the Git tag (setuptools-scm) — see [tool.setuptools_scm]
# and the metadata provider under [tool.scikit-build]. Tag a release `vX.Y.Z`.
dynamic = ["version"]
description = "Python bindings for the mirobody on-device server"
readme = "python/README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }

[tool.scikit-build]
# The Python package source lives under python/; the compiled _mirobody module
# is installed alongside it by the CMake install() rule.
wheel.packages = ["python/mirobody"]

# Build only the extension and its dependencies — skip the desktop executable,
# the cli/ tools, and the unit tests, which are irrelevant to the wheel.
build.targets = ["_mirobody"]

# Resolve the project version from the Git tag via setuptools-scm. On an sdist
# build the resolved version is baked into PKG-INFO, so wheels built from the
# sdist (no .git) pick it up from there.
metadata.version.provider = "scikit_build_core.metadata.setuptools_scm"

cmake.version = ">=3.19"
cmake.build-type = "Release"

# Source distribution contents. scikit-build-core defaults to every git-tracked
# file; we drop the parts CMake never compiles for the wheel (host apps, web /
# native clients, docs, tests) so the sdist stays small while still carrying
# everything `pip install` needs to build from source: src/, the self-registering
# res/ agents + MCP tools, CMakeLists.txt, and the vcpkg manifest.
[tool.scikit-build.sdist]
exclude = [
    "android/",
    "ios/",
    "electron/",
    "qt/",
    "miniapp/",
    "htdoc/",
    "bindings/",
    "cli/",
    "tests/",
    "docs/",
    "res/htdoc/",
]

# Build-time CMake options. The toolchain file and triplet for native deps
# (curl, OpenSSL, libwebsockets, …) are machine-specific and must be supplied at
# build time — see python/README.md. SQLITE keeps the wheel self-contained.
[tool.scikit-build.cmake.define]
MIROBODY_BUILD_PYTHON = "ON"
MIROBODY_BUILD_TOOLS = "OFF"
MIROBODY_BUILD_TESTS = "OFF"
MIROBODY_DATABASE_BACKEND = "SQLITE"

# Git-tag versioning. Release tags are `vX.Y.Z` (the leading `v` is stripped);
# an untagged build gets a PEP 440 dev version like `2.0.1.dev4+g<sha>`.
# `--match "v[0-9]*"` makes `git describe` ignore the repo's non-version tags
# (e.g. the `snapshots-*` tags), so only release tags drive the version.
[tool.setuptools_scm]
git_describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match", "v[0-9]*"]
