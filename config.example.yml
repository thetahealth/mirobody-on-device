# has no stable free quota. The closest paths are all account-credit-based:
#   1. Anthropic direct - https://console.anthropic.com/ gives a one-time
#      $5 trial credit at signup. Once it runs out you have to add a
#      payment method to keep using the key.
#   2. OpenRouter - https://openrouter.ai/ occasionally promotes free
#      Claude routes (usually older models or community-sponsored
#      endpoints). The mainstream `anthropic/claude-sonnet-4.x` routes are
#      pay-per-token. Useful if you want to try Claude without an
#      Anthropic account.
#   3. AWS Bedrock - run Claude under the AWS new-account free credits.
#      Setup is heavier (IAM + Bedrock model access request) and the API
#      shape is AWS-flavored, not the Anthropic Messages API.
#   4. Google Cloud Vertex AI - same idea using the $300 GCP signup
#      credit. Vertex requires you to enable the Claude publisher model
#      in your project first.
#
# Drop the resulting key below.
# ANTHROPIC_API_KEY: ''


# Embedding provider used to populate the th_series_dim vector recall
# column. Pick one based on which API key you have configured above:
#   - 'gemini' -> Google's text-embedding-001 (free via the GOOGLE_API_KEY
#     block above; recommended for getting started).
#   - 'qwen'   -> Qwen3 embedding via DashScope (needs DASHSCOPE_API_KEY).
#   - 'gemma'  -> EmbeddingGemma served locally over an OpenAI-compatible
#     endpoint (Ollama / llama.cpp). Fully on-device, no API key, no data
#     leaves the host — pairs with on-device chat. Vectors are 768-dim
#     (vs 1024 for gemini/qwen), so use one provider consistently per deployment.
# Default: gemini.
EMBEDDING_PROVIDER: 'gemini'

# 'gemma' provider settings (only used when EMBEDDING_PROVIDER: 'gemma').
# Point at a local OpenAI-compatible embeddings server; Ollama's default is below
# (run e.g. `ollama pull embeddinggemma` first).
# EMBEDDING_GEMMA_BASE_URL: 'http://localhost:11434/v1'   # falls back to OLLAMA_BASE_URL
# EMBEDDING_GEMMA_MODEL: 'embeddinggemma'
# EMBEDDING_GEMMA_API_KEY: ''        # usually empty for a local server
# EMBEDDING_GEMMA_DIM: 0             # 0 = model native (768); set 512/256/128 for MRL truncation

# On-device chat model, server-hosted. Set a base URL to expose "Base/gemma-4-e2b"
# in the provider picker: the same Gemma 4 E2B the native apps run on-device,
# served here over a local OpenAI-compatible endpoint (Ollama / llama.cpp / vLLM).
# Handy for trying the model from the Android/iOS clients without the on-device
# download. The provider is hidden until GEMMA_CHAT_BASE_URL (or OLLAMA_BASE_URL)
# is set. Set GEMMA_CHAT_MODEL to the name your runtime serves (e.g. the Ollama tag).
# GEMMA_CHAT_BASE_URL: 'http://localhost:11434/v1'   # falls back to OLLAMA_BASE_URL
# GEMMA_CHAT_MODEL: 'gemma-4-e2b'
# GEMMA_CHAT_API_KEY: ''             # usually empty for a local server

#-----------------------------------------------------------------------------
# Sentry (crash / error reporting).
#
# Brought up at startup by init_sentry() in src/main.cpp, mirroring the Python
# MCP server's bootstrap. Disabled by default: with no SENTRY_DSN the SDK is
# left uninitialised, so self-hosted / on-device runs report nothing unless you
# explicitly opt in here. The deployment environment is taken from the ENV
# environment variable (not this file), normalised to upper case; ENV=TEST-INLOCAL
# opts out entirely. Sentry's own debug logging follows LOG_LEVEL (on at DEBUG).
#
# The DSN that routes events to your Sentry project. This is the one key that
# turns reporting on; leave it unset (or empty) to keep Sentry off. Treat it as
# a secret — the server logs only that it is present and its length, never the
# value. Found in Sentry under Settings -> Projects -> <project> -> Client Keys (DSN).
# SENTRY_DSN: ''

# Release identifier stamped on events. When unset, the server falls back to
# "local-<short_sha>" from the git SHA captured at build time. In k8s this is
# usually baked into the image (e.g. "test-abc1234"). The literal 'unknown' is
# treated as unset.
# SENTRY_RELEASE: ''

# On-disk directory the crashpad backend uses for its run state and pending
# crash reports. Relative to the working directory. Default '.sentry-native'.
# SENTRY_DATABASE_PATH: '.sentry-native'

# Path to the crashpad_handler executable. The crashpad backend launches it as a
# separate process and sentry_init FAILS if it can't be found, so the SDK needs
# a valid path. Leave unset to use the handler CMake copies next to this binary;
# set it explicitly only when the handler lives elsewhere.
# SENTRY_HANDLER_PATH: ''

#-----------------------------------------------------------------------------
# MCP (Model Context Protocol).
#
# This server exposes its registered tools (src/mcp) over MCP at the /mcp
# endpoint, protected by the OAuth 2.0 authorization server configured above
# (see OAUTH_RESOURCE_PATH, default '/mcp'). Standard MCP clients obtain a token
# via the browser authorization-code + PKCE flow and then call /mcp directly —
# nothing extra is needed here for that path.
#
# The one key below is required only for the MiroThinker agent. Unlike the
# OpenAI / Gemini clients (which run the registered tools locally, in-process),
# MiroThinker executes tools PROVIDER-SIDE: MiroMind's endpoint reaches back over
# the public internet to call this server's MCP endpoint. So it needs the
# absolute, externally-reachable URL of /mcp — a localhost or private address
# won't work, because the call originates from MiroMind, not from this process.
# Without it, the MiroThinker client fails the turn with an explicit error.
#
# Public URL of this server's MCP endpoint, handed to MiroMind as the
# `mcp_servers[].url`. Point it at the externally-reachable /mcp (or a
# per-user /mcp/{secret} personal-MCP URL), e.g. 'https://api.example.com/mcp'.
# MCP_PUBLIC_URL: ''

