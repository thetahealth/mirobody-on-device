#-----------------------------------------------------------------------------
# Logging Configuration.

# Log level (case insensitive):
#   'debug', 'info', 'warning', 'error', or 'critical/fatal'.
LOG_LEVEL: 'DEBUG'

#-----------------------------------------------------------------------------
# HTTP Server Configuration.

HTTP_HOST: '0.0.0.0'
HTTP_PORT: 8080
# HTTP_URI_PREFIX: ''

# Extra headers added to every HTTP response, and used to answer CORS preflight
# OPTIONS requests. Uncomment the HTTP_HEADERS block below to enable CORS for
# browser clients.
#
# Notes:
#   - Allow-Origin '*' permits any origin. Auth here is a bearer token in the
#     Authorization header (not cookies), so credentials mode is not needed and
#     '*' is fine. Do NOT add Access-Control-Allow-Credentials: 'true' together
#     with '*' — browsers reject that combo; for credentials use a fixed origin.
#   - Allow-Headers lists the request headers the browser may send: Authorization
#     plus the custom X-Timezone header the frontend sets.
#   - Max-Age is how long (seconds) the browser may cache the preflight result.

# HTTP_HEADERS:
#   Access-Control-Allow-Origin: '*'
#   Access-Control-Allow-Methods: 'GET, POST, PUT, DELETE, OPTIONS'
#   Access-Control-Allow-Headers: 'Authorization, Content-Type, X-Timezone'
#   Access-Control-Max-Age: '86400'

# Static files served for GET requests that match no API route. Two forms:
#   - a bare string mounts ONE frontend at '/' (the common case):
#       HTTP_ROOT: 'res/htdoc'
#   - a {mount-path: directory} map serves SEVERAL frontends, each at its own
#     URL prefix. Mount paths are matched most-specific-first, so a deeper mount
#     wins over the '/' catch-all, and API routes always win over both. Useful
#     for hosting a second app (admin panel, dashboard, …) beside the main one:
#       HTTP_ROOT:
#         '/':          'res/htdoc'
#         '/dashboard': 'res/dashboard'
# A request for a mount root (or any path ending in '/') serves its index.html;
# the bare mount path ('/dashboard') 302-redirects to the slashed form so the
# frontend's relative asset URLs resolve correctly. Relative directories are
# resolved against the working directory. Setting HTTP_ROOT via an env var uses
# the bare-string form; pass the map as a JSON object string for several mounts.
# Empty disables static serving (unmatched GETs 404).
HTTP_ROOT: 'res/htdoc'

#-----------------------------------------------------------------------------
# Redis Configuration.
#
# Backs the cache layer (src/cache). OPTIONAL: leave REDIS_HOST empty and the
# server falls back to an in-process in-memory cache (no Redis needed for local
# / single-instance runs). Set REDIS_HOST and the server connects to Redis
# instead — required when multiple instances must share cache state. A bad
# host/port/password/TLS setting fails startup rather than silently degrading.

# Redis server hostname or IP. EMPTY (the default) selects the in-memory
# backend; any non-empty value switches to the Redis backend.
# REDIS_HOST: ''

# Redis server port. Default 6379.
# REDIS_PORT: 6379

# Logical database number, passed to SELECT. 0 (the default) issues no SELECT.
# REDIS_DB: 0

# Password for AUTH. Empty (the default) skips AUTH; set it for a Redis that
# requires a password (sent over TLS first when REDIS_SSL is on).
# REDIS_PASSWORD: ''

# Connect over TLS. Requires a build linked against hiredis_ssl
# (MIROBODY_HAS_HIREDIS_SSL); with TLS=true on a build without it, startup
# fails. CA trust uses OpenSSL's default verify paths (the system CA bundle);
# no custom CA / client-cert key is exposed here.
# REDIS_SSL: false

# Verify the server certificate's hostname (drives SNI + CN/SAN matching).
# false (the default) skips the hostname check but still validates the chain
# per REDIS_SSL_CERT_REQS. Only meaningful when REDIS_SSL is true.
# REDIS_SSL_CHECK_HOSTNAME: false

# Certificate verification mode (redis-py style): 'none', 'optional', or
# 'required'. Unset/empty defaults to 'required' (full verification — secure by
# default). Only meaningful when REDIS_SSL is true.
# REDIS_SSL_CERT_REQS: ''


#-----------------------------------------------------------------------------
# Object Storage Configuration.
#
# Four backends are available (src/storage/*); all compile into every build and
# are selected at runtime by which keys are set. Used to store generated assets
# (e.g. chart images) and user uploads, and hand back a URL. Access at runtime
# via cfg.s3() / cfg.oss() / cfg.azure_blob() / cfg.local_storage(); call
# .configured() before .open(). Precedence: S3 > OSS > Azure Blob > local.
#
# A cloud backend takes precedence; the local filesystem is the FALLBACK. When a
# cloud backend is configured, the LocalStorage HTTP mount stands down (the
# objects live in the cloud, not on this server's disk), so the LOCAL_STORAGE_*
# keys below apply only when no cloud backend is set.
#
# Most non-AWS clouds are S3-compatible -- use the S3 block with S3_ENDPOINT, no
# separate backend needed: Cloudflare R2, Backblaze B2, MinIO / Ceph, DO Spaces,
# Wasabi, Tencent COS, Huawei OBS, Oracle OCI, and Google Cloud Storage (XML API
# + HMAC interop keys, S3_ENDPOINT: 'https://storage.googleapis.com'). Only Azure
# Blob is not S3-compatible and has its own block (AZURE_BLOB_*).

# AWS S3 (or any S3-compatible store, e.g. MinIO / Cloudflare R2). Signed with
# AWS Signature Version 4. With no S3_ENDPOINT, requests go to the real AWS
# virtual-hosted host "<S3_BUCKET>.s3.<S3_REGION>.amazonaws.com"; set S3_ENDPOINT
# to target an S3-compatible service instead (path-style: bucket in the path).
# S3_KEY:      ''        # AWS access key id
# S3_TOKEN:    ''        # AWS secret access key
# S3_REGION:   ''        # e.g. us-east-1
# S3_BUCKET:   ''
# S3_PREFIX:   ''        # key prefix prepended to every object (empty => 'mirobody')
# S3_CDN:      ''        # CDN host for public_url() (optional)
# S3_ENDPOINT: ''        # S3-compatible host override (optional; empty => AWS)

# Alibaba Cloud OSS. Signed with the classic HMAC-SHA1 scheme. Multiple OSS
# instances are supported by appending an upper-case "_<NAME>" suffix to every
# key (mirroring the PostgreSQL suffix pattern below) and reading them via
# cfg.oss("name"); the unsuffixed keys below are cfg.oss().
# ALI_OSS_ACCESS_KEY:  ''                              # access key id
# ALI_OSS_SECRET_KEY:  ''                              # access key secret
# ALI_OSS_ENDPOINT:    'oss-cn-hangzhou.aliyuncs.com'  # region host
# ALI_OSS_BUCKET_NAME: ''
# ALI_OSS_PREFIX:      ''                              # key prefix (empty => 'mirobody')
# ALI_OSS_DOMAIN:      ''                              # custom domain for public_url() (optional)

# Azure Blob Storage. Signed with Shared Key (HMAC-SHA256); presigned reads use a
# service SAS. AZURE_BLOB_KEY is the account key as the portal shows it (base64).
# The blob host is "<account>.blob.<endpoint_suffix>".
# AZURE_BLOB_ACCOUNT:         ''                   # storage account name
# AZURE_BLOB_KEY:             ''                   # account key (base64)
# AZURE_BLOB_CONTAINER:       ''
# AZURE_BLOB_PREFIX:          ''                   # key prefix (empty => 'mirobody')
# AZURE_BLOB_ENDPOINT_SUFFIX: 'core.windows.net'   # override for sovereign clouds
# AZURE_BLOB_CDN:             ''                   # custom domain for public_url() (optional)

# Local filesystem — the no-credentials backend for self-hosted / on-device
# runs. Objects are written as files under LOCAL_STORAGE_DIR (which need NOT
# live under HTTP_ROOT — keeping uploads out of the web root avoids exposing
# them as ordinary static assets).
#
#   - LOCAL_STORAGE_PREFIX is the object-key prefix, same contract as S3_PREFIX /
#     ALI_OSS_PREFIX: prepended to every key internally, so callers pass
#     prefix-agnostic keys and objects land under LOCAL_STORAGE_DIR/<prefix>/.
#   - LOCAL_STORAGE_URL_PREFIX is the URL path THIS server serves objects at — a
#     URL concern only, NOT part of the stored path. With '/files',
#     put_object("chart.png") stores LOCAL_STORAGE_DIR/chart.png (flat under the
#     dir, or under the key prefix when one is set) and serves it at
#     /files/chart.png (the mount strips /files to find the file). Leave it empty
#     and this server does not serve the objects (public_url() returns a file://
#     URL unless a base URL is set).
#   - LOCAL_STORAGE_BASE_URL is the scheme://host the public URL is built on.
#     Leave it empty for a relative same-origin URL (/files/chart.png). Set it to
#     an absolute origin for absolute URLs. URL_PREFIX is appended automatically,
#     so give the HOST ONLY here — do NOT repeat the prefix: with URL_PREFIX
#     '/files', BASE_URL 'https://host' yields https://host/files/<key>. (A
#     trailing '/files' would double it to /files/files.)
#
# Set LOCAL_STORAGE_SECRET and presigned_url() appends a time-limited
# "?expires=<unix>&sig=<hmac>" the mount verifies before serving — a missing /
# expired / forged signature gets 403. The signature is over the object key, so
# it survives a CDN forwarding the query to origin. With no secret, objects under
# the mount are served unconditionally and presigned_url() equals public_url().
#
# Same-origin example: URL_PREFIX '/files', BASE_URL '' -> /files/<key>
# Absolute example:    URL_PREFIX '/files', BASE_URL 'https://cdn.example.com'
#                      -> https://cdn.example.com/files/<key>, origin serves /files/<key>
LOCAL_STORAGE_DIR:        '_local/storage'
# LOCAL_STORAGE_PREFIX:   ''                                  # key prefix prepended to every object (empty => 'mirobody')
LOCAL_STORAGE_URL_PREFIX: '/files'                            # URL serve path (optional; not on disk)
LOCAL_STORAGE_SECRET:     'REPLACE_THIS_VALUE_IN_PRODUCTION'  # HMAC key (optional; >=16 non-blank chars when URL_PREFIX set)
# LOCAL_STORAGE_BASE_URL: ''                                  # public prefix; absolute for CDN (optional)

# Encryption at rest for user uploads (optional). Set FILE_ENCRYPTION_KEY to one
# or more 44-char URL-safe-base64 Fernet keys and every chat upload and its
# .meta / .trans sidecars are stored Fernet-encrypted: a leaked S3/OSS/local
# credential then yields ciphertext, not file contents, because the keys live
# here — not with the storage secret. With encryption on, file bytes are served
# only THROUGH this server (decrypted in memory) at FILE_URL_PREFIX — a client
# can't decrypt bucket bytes itself, so bucket-direct / LocalStorage-disk URLs
# would be useless, and the disk mount stands down. FILE_URL_BASE is an optional
# absolute origin for those URLs (empty => relative same-origin). Empty =>
# disabled: uploads stored in the clear, exactly as before. Generate keys with
# the Fernet helper (same format as CONFIG_ENCRYPTION_KEY / Fernet.generate_key()).
#
# Key rotation (zero downtime): FILE_ENCRYPTION_KEY is a LIST — the LAST key
# encrypts new writes, ALL keys are tried on read. Rotate by APPENDING a new key
# (old objects keep decrypting under their key); once nothing is still encrypted
# under an old key, drop it. Accepts a YAML sequence or a comma-separated scalar.
#
# FILE_KEY_SEED is REQUIRED when encryption is on: a stable, separate secret that
# seeds object-KEY paths, kept apart from the rotatable encryption keys so
# rotating them leaves every path unchanged. It must NEVER change once uploads
# exist (changing it re-paths and orphans them). The server refuses to start on a
# changed seed, or on a key list that shares nothing with what existing uploads
# used (a non-secret fingerprint is recorded in a '.file-encryption-check' marker).
# FILE_ENCRYPTION_KEY:                                        # list; last encrypts, all decrypt
#   - ''                                                      # newest key
# FILE_KEY_SEED:       ''                                     # stable seed; required when encryption on; never change
# FILE_URL_PREFIX:     '/files'                               # app serve path for decrypted bytes
# FILE_URL_BASE:       ''                                     # absolute origin for read URLs (optional)

#-----------------------------------------------------------------------------
# Database Configuration.
#
# Exactly one backend is linked per build, chosen at compile time via the
# MIROBODY_DATABASE_BACKEND CMake option (SQLITE / DUCKDB / POSTGRESQL /
# POSTGRESQL_LEGACY / MYSQL / CLICKHOUSE). Only the keys for the backend you
# built are read; the rest are ignored. PostgreSQL is configured above; the
# blocks below cover the others. Uncomment the one matching your build.
#
# Configuring a backend is TWO steps: (1) pick it when you BUILD (CMake,
# compile-time — baked into build/CMakeCache.txt), then (2) set that backend's
# connection keys HERE (runtime). Switching the build choice later needs a
# reconfigure, not just editing this file.
#
# Build with the build.cmd / build.sh wrappers — they set up the compiler env,
# the vcpkg toolchain and Ninja (a bare `cmake -B build` does not). The wrapper
# reads MIROBODY_DATABASE_BACKEND and forwards it to CMake only on a FRESH
# configure, so use `clean` when CHANGING an already-built tree (the first build
# needs no `clean`).
#
#   Example A — PostgreSQL (the desktop default):
#     1. build:  MIROBODY_DATABASE_BACKEND=POSTGRESQL_LEGACY ./build.sh clean          (Linux/macOS)
#                set "MIROBODY_DATABASE_BACKEND=POSTGRESQL_LEGACY" && build.cmd clean   (Windows)
#     2. config: set PG_HOST / PG_PORT / PG_USER / PG_PASSWORD / PG_DBNAME below.
#
#   Example B — SQLite (zero-dependency local / tests):
#     1. build:  MIROBODY_DATABASE_BACKEND=SQLITE ./build.sh clean                     (Linux/macOS)
#                set "MIROBODY_DATABASE_BACKEND=SQLITE" && build.cmd clean              (Windows)
#     2. config: SQLITE_PATH: mirobody.sqlite      # a real file (not :memory:)
#
# (Advanced: reconfigure an existing build/ in place, no full rebuild, with
#  `cmake -B build -DMIROBODY_DATABASE_BACKEND=…` && `cmake --build build` — reuses
#  the cached toolchain; on Windows run it from a VS Developer shell.)
#
# Check what a binary was actually built with:
#     findstr MIROBODY_DATABASE_BACKEND build\CMakeCache.txt    (Windows)
#     grep    MIROBODY_DATABASE_BACKEND build/CMakeCache.txt    (Linux/macOS)
#
# Tables are created on first boot by the schema migration — but that step is
# SKIPPED unless the ENV var is set to a NON-managed value (anything other than
# test / gray / prod; note an UNSET ENV also skips). For a fresh local DB run
# e.g. `ENV=local`. See src/database/README.md for the full backend guide.


# The keys below configure the default (unsuffixed) PostgreSQL instance,
# returned by `cfg.postgresql()` with no argument.
#
# Additional instances (e.g. a separate reporting / analytics DB) use a
# suffix: append `_<NAME>` to each key. The suffix is upper-cased on
# lookup, so the YAML key must already be upper case. Access at runtime
# via `cfg.postgresql("name")`.
#
#   PG_HOST_REPORTING:           'reports.example.com'
#   PG_PORT_REPORTING:           5432
#   PG_USER_REPORTING:           'readonly'
#   PG_PASSWORD_REPORTING:       '...'
#   PG_DBNAME_REPORTING:         'metrics'
#   PG_SCHEMA_REPORTING:         'public' 
#   PG_MIN_CONNECTION_REPORTING: 1
#   PG_MAX_CONNECTION_REPORTING: 5
#
# `PG_ENCRYPTION_KEY` is intentionally NOT suffixed - one key encrypts
# every PG instance's column-level secrets across the deployment.

# Prefer the IPv4 literal 127.0.0.1 over the name `localhost` for a local
# Postgres. On Windows, `localhost` resolves to IPv6 `::1` first and only then
# IPv4; when Postgres is reached over IPv4 only (Docker Desktop / WSL2 port
# forwarding, which silently drops `::1` SYNs rather than refusing them), each
# connection wastes the ~21s Windows TCP connect timeout on the dead `::1`
# before falling back. The pool opens PG_MIN_CONNECTION connections serially at
# startup, so that delay is multiplied (e.g. 5 x ~21s ≈ 100s of startup hang).
# Using 127.0.0.1 skips IPv6 resolution entirely. Use a hostname only when the
# server genuinely listens on IPv6 or is remote.
PG_HOST: '127.0.0.1'
PG_PORT: 5432
PG_USER: 'postgres'
PG_PASSWORD: 'REPLACE_THIS_VALUE_IN_PRODUCTION'
PG_DBNAME: 'mirobody'
PG_SCHEMA: 'public'
PG_ENCRYPTION_KEY: 'REPLACE_THIS_VALUE_IN_PRODUCTION'
PG_MIN_CONNECTION: 5
PG_MAX_CONNECTION: 20


# SQLite (MIROBODY_DATABASE_BACKEND=SQLITE). File path for the database; empty
# opens an in-memory DB, but migration and the server use separate connections,
# so a real file is required for them to share schema/data.
# SQLITE_PATH: 'mirobody.sqlite'


# DuckDB (MIROBODY_DATABASE_BACKEND=DUCKDB). Same in-memory caveat as SQLite.
# DUCKDB_PATH: 'mirobody.duckdb'


# MySQL (MIROBODY_DATABASE_BACKEND=MYSQL).
# MYSQL_HOST: '127.0.0.1'
# MYSQL_PORT: 3306
# MYSQL_USER: 'mirobody'
# MYSQL_PASSWORD: 'REPLACE_THIS_VALUE_IN_PRODUCTION'
# MYSQL_DBNAME: 'mirobody'
# MYSQL_ENCRYPTION_KEY: 'REPLACE_THIS_VALUE_IN_PRODUCTION'
# MYSQL_MIN_CONNECTION: 5
# MYSQL_MAX_CONNECTION: 20


# ClickHouse (MIROBODY_DATABASE_BACKEND=CLICKHOUSE). Stub backend today — these
# keys are parsed but the client is not implemented yet.
# CLICKHOUSE_HOST: '127.0.0.1'
# CLICKHOUSE_PORT: 9000
# CLICKHOUSE_USER: 'default'
# CLICKHOUSE_PASSWORD: 'REPLACE_THIS_VALUE_IN_PRODUCTION'
# CLICKHOUSE_DBNAME: 'mirobody'
# CLICKHOUSE_ENCRYPTION_KEY: 'REPLACE_THIS_VALUE_IN_PRODUCTION'
# CLICKHOUSE_MIN_CONNECTION: 5
# CLICKHOUSE_MAX_CONNECTION: 20

#-----------------------------------------------------------------------------
# User login.

# Predefined email addresses and verification codes for testing/demo
# purposes. Uncomment the block to enable instant demo login: each entry
# maps an email to the verification code that acts as its password.
EMAIL_PREDEFINE_CODES:
  demo1@mirobody.ai: '777777'
  demo2@mirobody.ai: '777777'
  demo3@mirobody.ai: '777777'

# Predefined verification codes by *domain* (the part after '@'), for when a
# whole example.com domain should share one code instead of listing every address.
# Any address whose domain matches a key — and that isn't already listed in
# EMAIL_PREDEFINE_CODES above — logs in with the mapped code. Exact addresses
# take precedence over domain matches. Example: "example.com" lets demo0@example.com,
# demo1@example.com, ... all log in with 777777.
# EMAIL_PREDEFINE_DOMAIN_CODES:
#   example.com: '777777'


# Verification-code email delivery (see src/user/email.*). When configured, the
# server emails a 6-digit code to an address and checks what the user sends back;
# without these keys only the EMAIL_PREDEFINE_CODES above can log in.
#
# The transport is auto-selected from what you set:
#   - Direct SMTP:  EMAIL_SMTP_HOST + EMAIL_SMTP_USER + EMAIL_SMTP_PASS + EMAIL_FROM.
#   - Mandrill API: point EMAIL_SMTP_HOST at an *.mandrillapp.com host and put the
#                   Mandrill API key in EMAIL_SMTP_PASS, plus EMAIL_TEMPLATE + EMAIL_FROM.
# Addresses listed in EMAIL_PREDEFINE_CODES skip delivery entirely.

# SMTP server hostname, e.g. smtp.example.com (or smtp.mandrillapp.com to send
# through the Mandrill HTTP API instead of raw SMTP).
# EMAIL_SMTP_HOST: ''

# SMTP port. 465 => implicit TLS (SMTPS); 587 or any other => STARTTLS. Default 465.
# EMAIL_SMTP_PORT: 465

# SMTP login user (often identical to EMAIL_FROM).
# EMAIL_SMTP_USER: ''

# SMTP password. In Mandrill mode this is the Mandrill API key, not a password.
# EMAIL_SMTP_PASS: ''

# Address the code is sent from. Required for any real delivery.
# EMAIL_FROM: ''

# Display name shown on the From header. Defaults to "Theta Wellness" when empty.
# EMAIL_FROM_NAME: ''

# Mandrill template name that renders the code (its CODE merge var). Only used in
# Mandrill mode; ignored for direct SMTP, which sends a built-in HTML email.
# EMAIL_TEMPLATE: ''

#-----------------------------------------------------------------------------
# OAuth.

# Default claim values that JwtHs256 / JwtRs256.generate() mint into the
# `iss` / `aud` / `client_id` / `scope` fields of tokens this mirobody
# instance signs itself. Distinct from FIREBASE_PROJECT_ID below, which
# governs verification of tokens signed elsewhere.
#
# The strings are arbitrary identifiers - mirobody doesn't validate them
# against any external registry. The only requirement is that whatever
# verifier consumes these tokens (another service, an MCP server, etc.)
# expects the same values. Keep them in sync across deployments that
# share an audience.
# JWT_ISS: ''
# JWT_AUD: ''
# JWT_CLIENT_ID: ''
# JWT_SCOPE: ''
JWT_SALT: 'REPLACE_THIS_VALUE_IN_PRODUCTION'

# JWT secret key used for the HS256 (symmetric) algorithm.
#
# NOTE: JWT_KEY is used ONLY in HS256 mode. If JWT_PRIVATE_KEY is set (RS256
# mode, below) the server signs and verifies with the RSA keys and JWT_KEY is
# IGNORED. Set exactly one: JWT_KEY for HS256, or JWT_PRIVATE_KEY for RS256.
JWT_KEY: 'REPLACE_THIS_VALUE_IN_PRODUCTION'

# JWT signing key for the RS256 (asymmetric) algorithm. When set, it TAKES
# PRECEDENCE over JWT_KEY: the server signs tokens with RS256 (not HS256, so
# JWT_KEY is ignored) and publishes the matching public key as a JWKS at
# /.well-known/jwks.json (advertised as `jwks_uri` in the OAuth discovery
# metadata), so third-party resource servers can verify mirobody-issued tokens
# without sharing a secret. PEM (PKCS#1 or PKCS#8).
# JWT_PRIVATE_KEY: |
#   -----BEGIN PRIVATE KEY-----
#   ...
#   -----END PRIVATE KEY-----
#
# Public key (SubjectPublicKeyInfo PEM). Optional: when omitted it is derived
# from JWT_PRIVATE_KEY, so configuring the private key alone is enough. Set it
# explicitly only for a verify-only deployment that has no private key.
# JWT_PUBLIC_KEY: |
#   -----BEGIN PUBLIC KEY-----
#   ...
#   -----END PUBLIC KEY-----
#
# Key rotation: additional verify-only public keys, numbered from _2 and scanned
# contiguously (JWT_PUBLIC_KEY_2, JWT_PUBLIC_KEY_3, ...). They are published in
# the JWKS and accepted when verifying, but never used to sign — the active
# signer stays the single JWT_PRIVATE_KEY. To rotate with no downtime: promote
# the new key to JWT_PRIVATE_KEY and move the previous public key to
# JWT_PUBLIC_KEY_2; once tokens signed by it have expired, drop it.
# JWT_PUBLIC_KEY_2: |
#   -----BEGIN PUBLIC KEY-----
#   ...
#   -----END PUBLIC KEY-----


# -- OAuth 2.0 authorization server -----------------------------------------
#
# Turns this server into an OAuth 2.0 authorization server so MCP clients (and
# any standard OAuth client) can obtain access tokens for the /mcp endpoint via
# the browser authorization-code + PKCE flow. It issues the same mb_oauth JWTs
# configured above; these keys only tune the protocol surface and all have
# working defaults, so OAuth works out of the box once JWT_KEY is set. Discovery
# is served at the host root: /.well-known/oauth-authorization-server and
# /.well-known/oauth-protected-resource.
#
# Public base URL advertised as the discovery `issuer` and used to build the
# absolute endpoint URLs. Leave unset to derive it per-request from the Host
# header (http for localhost/127.0.0.1, https otherwise) -- correct for
# single-origin deployments and dev. Set it when behind a proxy whose external
# origin differs from the Host it forwards.
# OAUTH_ISSUER: 'https://api.example.com'
#
# SPA path the authorize endpoint redirects to so the user signs in (reusing the
# existing web login UI) and approves; the request handle is appended as
# ?oauth_consent=<id>. HTTP_URI_PREFIX is prepended automatically.
# OAUTH_CONSENT_PATH: '/'
#
# Lifetimes in seconds. Codes and pending requests are short-lived by design;
# registered clients are long-lived.
# OAUTH_CODE_TTL: 600          # authorization code (single-use)
# OAUTH_AUTHZ_TTL: 600         # pending authorize request (until consent)
# OAUTH_CLIENT_TTL: 31536000   # dynamically-registered client record (1 year)
#
# Space-delimited scopes advertised in discovery and granted by default.
# OAUTH_SCOPES: 'mcp:read mcp:write'
#
# Path of the protected resource clients are sent to (the MCP endpoint). Used to
# build the protected-resource metadata and the WWW-Authenticate challenge.
# OAUTH_RESOURCE_PATH: '/mcp'
#
# Optional host allowlist for https redirect URIs (space/comma-separated). Empty
# accepts any https host, plus loopback http and custom-scheme URIs (RFC 8252
# native-app redirects). Set it to lock https redirects to known hosts.
# OAUTH_ALLOWED_REDIRECT_HOSTS: 'claude.ai chatgpt.com'


# -- EHR connect (SMART on FHIR) --------------------------------------------
#
# Lets a user link their hospital/clinic EHR (Epic, Oracle Health/Cerner,
# athenahealth, …) and pull their records, driven by health::EhrConnectService
# and the web client's Settings -> "Connect EHR". Here mirobody is an OAuth
# *client* of the EHR (distinct from the OAuth server block above). You register
# this app once with each EHR vendor (e.g. Epic on FHIR at https://fhir.epic.com)
# to get a client_id; the redirect_uri must match the registration and point at
# this server's callback. Empty client_id/redirect_uri disables the flow.
#
#   - SMART_FHIR_CLIENT_ID:     the SMART app client id from the EHR vendor.
#   - SMART_FHIR_REDIRECT_URI:  absolute URL of this server's callback, i.e.
#                               https://<your-host><HTTP_URI_PREFIX>/health/ehr/callback
#   - SMART_FHIR_CLIENT_SECRET: only for a confidential client; public clients
#                               (browser/native) use PKCE alone — leave empty.
#   - SMART_FHIR_SCOPE:         requested scopes; the default covers patient-context
#                               launch + reading the Observations we ingest.
# SMART_FHIR_CLIENT_ID: ''
# SMART_FHIR_REDIRECT_URI: 'https://api.example.com/health/ehr/callback'
# SMART_FHIR_CLIENT_SECRET: ''
# SMART_FHIR_SCOPE: 'launch/patient openid fhirUser offline_access patient/Observation.read'


# -- Device-brand vendor clients (Fitbit / Withings / Garmin / Oura / WHOOP / Polar)
#
# Direct device-brand clients (src/health/vendor/device/) are configured through the
# config object with per-vendor keys <ID>_CLIENT_ID / <ID>_CLIENT_SECRET /
# <ID>_API_KEY / <ID>_BASE_URL, where <ID> is the upper-cased vendor id:
#   <ID>_CLIENT_ID       OAuth client id (from the brand's developer app)
#   <ID>_CLIENT_SECRET   OAuth client secret
#   <ID>_API_KEY         a user's OAuth access token (obtained out of band)
#   <ID>_BASE_URL        API host override (optional; region / self-host)
# These are read through the config store, so each works set EITHER here in the YAML
# OR as the same-named environment variable (the env var wins). Registering a
# developer app is free and self-serve for most brands — see src/health/vendor/README.md
# for the per-brand access model.
#
# The B2B aggregators use the SAME <ID>_* convention (TERRA_CLIENT_ID / TERRA_API_KEY,
# VALIDIC_CLIENT_ID / VALIDIC_API_KEY, ROOK_CLIENT_ID / ROOK_CLIENT_SECRET, THRYVE_*,
# METRIPORT_API_KEY, …) — one <ID>_CLIENT_ID / _CLIENT_SECRET / _API_KEY / _BASE_URL
# set per vendor id. Uncomment and fill the ones you use:
# OURA_CLIENT_ID: ''
# OURA_CLIENT_SECRET: ''
# WHOOP_CLIENT_ID: ''
# WHOOP_CLIENT_SECRET: ''
# POLAR_CLIENT_ID: ''
# POLAR_CLIENT_SECRET: ''
# FITBIT_CLIENT_ID: ''
# FITBIT_CLIENT_SECRET: ''
# WITHINGS_CLIENT_ID: ''
# WITHINGS_CLIENT_SECRET: ''
# GARMIN_CLIENT_ID: ''
# GARMIN_CLIENT_SECRET: ''


# -- Per-user vendor OAuth tokens: encryption at rest ------------------------
#
# When a user connects a vendor via POST /vendors/{id}/bind/verify with an OAuth
# {code, redirect_uri}, the server exchanges the code and stores THAT user's access +
# refresh tokens in user_vendor_accounts, so it can pull their data and refresh the
# access token when it expires (Vendor::refresh). Those tokens are bearer secrets, so
# they are stored ONLY encrypted: set VENDOR_TOKEN_ENCRYPTION_KEY to one or more
# Fernet keys (same 44-char URL-safe base64 format as FILE_ENCRYPTION_KEY, and the
# same rotation contract — the LAST key encrypts, ALL keys decrypt; append to rotate,
# drop an old key once no token is still under it).
#
# DEFAULT = FILE_ENCRYPTION_KEY. When this is unset it falls back to your
# FILE_ENCRYPTION_KEY, because a vendor token is user data at rest just like an upload.
# So if you already encrypt uploads, per-user vendor tokens are encrypted too with no
# extra config — durable and correct across multiple server instances. Set this only
# to rotate the token key independently of the file key.
#
# With NEITHER key set there is NO key: /bind/verify still proves ownership but
# persists nothing (a plaintext token is never written), and fetch falls back to the
# configured <ID>_* credential. Note there is no encryption-free way to store per-user
# tokens that ALSO works across machines — a leaked DB or a shared Redis would expose
# plaintext — so a multi-instance, multi-user deployment MUST set a key (this or
# FILE_ENCRYPTION_KEY). No key ⇒ effectively single-instance / the shared credential.
# VENDOR_TOKEN_ENCRYPTION_KEY:
#   - ''

# Web vendor-OAuth connect callback. The "Connect" button in the web client sends the
# user to the vendor's consent page, and the vendor redirects the browser back HERE.
# Set it to this server's GET /vendors/callback and register the SAME URL in each
# vendor's developer console (it must match the token-exchange redirect_uri too).
# Empty disables web Connect (GET /vendors/{id}/authorize reports "not configured").
# VENDOR_REDIRECT_URI: 'https://api.example.com/vendors/callback'


# -- Dexcom CGM connect (direct vendor client) ------------------------------
#
# Reads a user's Dexcom continuous-glucose data through Dexcom's own v3 Web API
# (health::vendor "dexcom", src/health/vendor/device/dexcom.cpp). This is a CLOUD
# read: the Dexcom sensor's Bluetooth is proprietary/encrypted and unreadable by a
# third party, so data flows sensor -> official Dexcom app -> Dexcom cloud -> here.
# Note the API is RETROSPECTIVE by regulatory design: glucose values are delayed
# ~1h in the US and ~3h outside the US, with no real-time push.
#
# Register a (free) app at https://developer.dexcom.com to get the client id/secret.
# Access is free to start: the sandbox is immediate; production Limited Access (up
# to 5 real users) needs only app registration; serving more real users requires a
# Dexcom commercial partnership + Data Licensing Agreement. Because glucose is PHI,
# a production deployment also needs a HIPAA BAA with each service in the pipeline.
#
# Dexcom uses the same <ID>_* device-brand keys as the block above (DEXCOM_CLIENT_ID /
# DEXCOM_CLIENT_SECRET / DEXCOM_API_KEY / DEXCOM_BASE_URL), plus one Dexcom-specific key:
#   - DEXCOM_CLIENT_ID / DEXCOM_CLIENT_SECRET: the OAuth app credentials. Empty
#     leaves the client unconfigured (bind still records a link; fetch fails until
#     credentials + a user access token exist).
#   - DEXCOM_API_KEY: the per-user OAuth access token (exchanged out of band at
#     /v2/oauth2/token). The in-app authorize/callback flow reuses authorize_url()
#     once the vendor consent seam (health::verify_consent) is wired.
#   - DEXCOM_ENVIRONMENT: which host to target — 'sandbox' (the default: immediate,
#     fake data, no real PHI), 'us' (production, https://api.dexcom.com) or
#     'eu'/'ous' (production outside the US, https://api.dexcom.eu). An explicit
#     DEXCOM_BASE_URL overrides this mapping.
# DEXCOM_CLIENT_ID: ''
# DEXCOM_CLIENT_SECRET: ''
# DEXCOM_ENVIRONMENT: 'sandbox'


# -- Chat rate limit --------------------------------------------------------
#
# Each /api/chat turn (SSE or WebSocket) drives an upstream LLM call, so a
# per-user rolling-window cap guards against runaway loops and abuse. The
# compiled default is 0 = unlimited; this template enables a conservative cap
# below. Set CHAT_RATE_MAX back to 0 to disable, or raise it for heavier use.
#
CHAT_RATE_MAX: 5              # max agent/live turns per user per window (0 = off)
CHAT_RATE_WINDOW_SEC: 60      # window length in seconds


# -- Care-circle limits -----------------------------------------------------
#
# Bound care-circle growth and curb abuse. The compiled default for every cap is
# 0 = unlimited; this template enables conservative caps below. Set any back to 0
# to disable it.
#
#   - CIRCLE_MAX_PER_USER:      max active circles a single user may own.
#   - CIRCLE_MAX_MEMBERS:       max members per circle (pending invites count,
#                               so a circle can't be filled with open invites).
#   - CIRCLE_INVITE_MAX:        invitations one user may send per rolling window
#                               (each also creates a shell account + sends mail).
#   - CIRCLE_INVITE_WINDOW_SEC: length of that window, in seconds (default 3600).
#
CIRCLE_MAX_PER_USER: 5
CIRCLE_MAX_MEMBERS: 5
CIRCLE_INVITE_MAX: 10
CIRCLE_INVITE_WINDOW_SEC: 1800


# -- How to configure Firebase ----------------------------------------------
#
# Firebase Authentication brokers the federated ("social") sign-ins and lets the
# server trust them through a single verifier. mirobody uses it two ways:
#
#   - Token verification (server): jwt::FirebaseTokenValidator accepts any
#     Firebase ID token by its iss/aud (FIREBASE_PROJECT_ID) and reads the email.
#     POST /firebase/verify runs this path, so EVERY Firebase-brokered provider --
#     Google, GitHub, and X (Twitter) -- lands there regardless of which one the
#     user picked. There is no per-provider server route for these.
#   - Web sign-in buttons (client): GET /firebase/verify hands the browser the web
#     app config (the two FIREBASE_WEB_* keys below). The web client shows
#     "Continue with Google" and "Continue with X" only when that config is
#     present; clicking opens a Firebase popup and POSTs the resulting ID token to
#     /firebase/verify. The native Android / iOS apps do the same via the Firebase
#     SDK (Google, GitHub, X), so they need no per-provider secret on the device.
#
# (GitHub on the WEB is the exception: it has its own server-side OAuth route --
# see GITHUB_CLIENT_* below -- and does NOT go through Firebase. GitHub on mobile
# still uses Firebase. X has no server keys at all; it is configured entirely in
# the Firebase console + the FIREBASE_WEB_* keys here.)
#
# Console setup (the free Spark tier is enough for development):
#   1. Create a project at https://console.firebase.google.com/ -- see
#      FIREBASE_PROJECT_ID below for the walkthrough and where to read the id.
#   2. Build -> Authentication -> Sign-in method: enable each provider you want,
#      pasting that provider's OAuth credentials into Firebase:
#        - Google: no extra credentials needed.
#        - GitHub: a GitHub OAuth App's client id + secret.
#        - Twitter (this IS X): the X app's API key + secret. ALSO turn on
#          "Request email address from users" in the X developer portal -- X only
#          releases an email then, and mirobody keys accounts by email, so without
#          it X sign-in fails with "no verified email".
#   3. Authentication -> Settings -> Authorized domains: add the web client's
#      origin (Firebase pre-adds localhost and <projectId>.firebaseapp.com).
#   4. Project settings -> General -> Your apps: register a Web app to get the
#      browser apiKey + project number for FIREBASE_WEB_* below; for the native
#      apps download google-services.json (Android) / GoogleService-Info.plist
#      (iOS) and drop them into the respective app projects.
# ----------------------------------------------------------------------------

# Firebase project ID. Used by jwt::FirebaseTokenValidator (and the firebase_jwt
# CLI) to verify the `aud` claim on incoming ID tokens, and returned to the web
# client as `projectId` for Google / X sign-in.
#
# To get one of your own (free):
#   1. Sign in at https://console.firebase.google.com/ with any Google
#      account; click "Add project" and pick a name (e.g. my-app-dev).
#      Disable Google Analytics if you don't want the GA-linked account.
#   2. Once the project is created, the project ID is shown at the top of the
#      project's General Settings page (it may differ from the display name;
#      Firebase auto-suffixes when the name is taken).
#   3. Enable Google under Build -> Authentication -> Sign-in method, and add the
#      web client's origin under Authentication -> Settings -> Authorized domains.
#   4. The Spark (free) tier is enough for development.
FIREBASE_PROJECT_ID: 'mirobody-81000'

# Firebase *web app* config for the web client's "Continue with Google" and
# "Continue with X" buttons (both go through Firebase -- see the Firebase setup
# notes above). GET /firebase/verify returns {apiKey, projectId, messagingSenderId}
# ONLY when both keys below are set, and the client shows those buttons only then.
# The client derives the rest itself: authDomain is "<projectId>.firebaseapp.com"
# (Firebase hosts the /__/auth/handler there) and appId isn't needed for Auth.
#
#   - FIREBASE_WEB_API_KEY:         the web app's browser `apiKey`, from Firebase
#                                   Project settings -> General -> Your apps. The
#                                   Android key in google-services.json (below)
#                                   also works unless it is platform-restricted,
#                                   in which case sign-in fails with
#                                   auth/api-key-not-valid -- then use the Web
#                                   app's key.
#   - FIREBASE_MESSAGING_SENDER_ID: the project number.
FIREBASE_WEB_API_KEY: 'AIzaSyCGuHqukiVwiClH0b1HYpW4I1bGdK9O-1w'
FIREBASE_MESSAGING_SENDER_ID: '555773021699'

