# mirobody-on-device configuration template.
#
# This file is the LOWEST config layer, read from the repo root by the
# development build (see src/config/README.md): copy it to config.yml to
# override values. Environment variables win over both. The phone apps ship no
# config file at all -- they pass what they need through mirobody_set_config()
# (src/mirobody.h) -- so everything here is about running the core on a
# development machine.
#
# Server-side settings (Postgres, Redis, object stores, OAuth, social login,
# vendor OAuth apps, ...) belong to the main mirobody server:
# https://github.com/thetahealth/mirobody

#------------------------------------------------------------------------------
# Logging: 'debug', 'info', 'warning', 'error', or 'critical/fatal'.
LOG_LEVEL: 'DEBUG'

#------------------------------------------------------------------------------
# Optional loopback HTTP front door (development build only; the phone builds
# talk to the core in-process). Keep it on loopback: the core holds a health
# record and is not meant to face a network.
HTTP_HOST: '127.0.0.1'
HTTP_PORT: 8080
# Largest request body accepted (uploads ride inside POST /api/chat).
# HTTP_MAX_BODY_BYTES: 33554432

#------------------------------------------------------------------------------
# The record: one SQLite file plus a directory of original files.
#
# An empty SQLITE_PATH opens an in-memory database, but migration and the core
# use separate connections, so a real file is required for them to share data.
SQLITE_PATH: '_local/mirobody.db'
DB_INIT_SCHEMA: true

# Uploaded originals (lab-report PDFs, photos), charts and extracted text live
# as files under LOCAL_STORAGE_DIR. With URL_PREFIX set they are served back at
# that path, signed with LOCAL_STORAGE_SECRET (>= 16 chars).
LOCAL_STORAGE_DIR:        '_local/storage'
LOCAL_STORAGE_URL_PREFIX: '/files'
LOCAL_STORAGE_SECRET:     'REPLACE_THIS_VALUE_IN_PRODUCTION'

# Encrypt files at rest (Fernet key list: the last encrypts, all decrypt).
# FILE_ENCRYPTION_KEY: ''

#------------------------------------------------------------------------------
# Tokens for the loopback front door (HS256). The phone builds generate their
# own; these are development placeholders.
JWT_SALT: 'REPLACE_THIS_VALUE_IN_PRODUCTION'
JWT_KEY:  'REPLACE_THIS_VALUE_IN_PRODUCTION'

# Development sign-in: each entry maps an email to a code that acts as its
# password. Well-known codes, so only uncomment on a machine nobody else reaches.
# EMAIL_PREDEFINE_CODES:
#   demo1@mirobody.ai: '777777'

# Google sign-in in the phone apps verifies Firebase ID tokens against this
# project (the one android/app/src/main/assets/google-services.json names).
FIREBASE_PROJECT_ID: 'mirobody-81000'

#------------------------------------------------------------------------------
# Models.
#
# The native apps run a model on the device (LiteRT-LM / llama.cpp, see
# docs/on-device-llm.md); nothing below is needed for that lane. These keys
# enable the BYOK cloud lane: the user's own key, straight to the provider.
# Any one is enough; a provider with no key is simply not offered.
# OPENAI_API_KEY: ''
# GOOGLE_API_KEY: ''
# DASHSCOPE_API_KEY: ''
# ZHIPU_API_KEY: ''
# DEEPSEEK_API_KEY: ''

# The agent that answers a turn that names none. 'Baseline' is the one built in.
DEFAULT_AGENT: 'Baseline'

# The same small model the phones run, served locally over an OpenAI-compatible
# endpoint (Ollama / llama.cpp), for trying the device lane from a desktop.
# GEMMA_CHAT_BASE_URL: 'http://localhost:11434/v1'
# GEMMA_CHAT_MODEL: 'gemma-4-e2b'

# Embeddings for long-term memory: 'gemini', 'qwen', or 'gemma' (a local
# OpenAI-compatible server; no key, nothing leaves the host).
EMBEDDING_PROVIDER: 'gemini'
# EMBEDDING_GEMMA_BASE_URL: 'http://localhost:11434/v1'

# Long-term memory: 'local' (facts and embeddings in the SQLite file) or 'none'.
MEMORY_PROVIDER: 'local'

#------------------------------------------------------------------------------
# Limits. Each chat turn drives a model call, so a per-user rolling window
# guards against runaway loops. 0 disables it.
CHAT_RATE_MAX: 5
CHAT_RATE_WINDOW_SEC: 60
