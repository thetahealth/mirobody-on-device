# -- How to configure GitHub sign-in ----------------------------------------
#
# GitHub sign-in reaches mirobody two different ways, but BOTH are driven by a
# single GitHub OAuth App's client id + secret:
#
#   - Web: a native server-side flow owned by mirobody (the GITHUB_* keys below,
#     NOT Firebase). The web login shows a GitHub button only when both keys are
#     set; it redirects to GitHub's authorize page (scope read:user user:email),
#     GitHub bounces back with an OAuth code POSTed to /github/verify, and the
#     server exchanges it via github.com/login/oauth/access_token (the secret
#     never leaves the server) and reads the account's primary verified email
#     from api.github.com/user/emails to identify the user.
#   - Mobile (Android / iOS): brokered through Firebase like Google/X -- you
#     paste the SAME client id + secret into the Firebase console (see the
#     Firebase setup notes above), and the apps need no GitHub secret on-device.
#
# Setup:
#   1. Create an OAuth App at github.com -> Settings -> Developer settings ->
#      OAuth Apps -> New OAuth App. (An "OAuth App", not a "GitHub App".)
#   2. Set "Authorization callback URL" to the web client's URL -- the login page
#      itself (e.g. https://app.example.com/). GitHub allows only one callback
#      URL per OAuth App, so use a separate app per environment if localhost and
#      prod differ.
#   3. Copy the Client ID, then "Generate a new client secret" and copy it.
#   4. Put both into GITHUB_CLIENT_ID / GITHUB_CLIENT_SECRET below for web; and,
#      for the mobile apps, paste the same pair into Firebase console -> Build ->
#      Authentication -> Sign-in method -> GitHub.
#
# Both keys are required to enable the web route; with either unset /github/verify
# reports "not configured" and the web button stays hidden.
# GITHUB_CLIENT_ID: ''
# GITHUB_CLIENT_SECRET: ''
# GITHUB_OAUTH_BASE: 'https://github.com'      # override only to point tests at a mock
# GITHUB_API_BASE: 'https://api.github.com'    # override only to point tests at a mock

# -- Tanka QR-code sign-in (web) --------------------------------------------
#
# Tanka login needs NONE of our own credentials: the browser runs Tanka's own
# WASM request-signer and signs the create-QR / poll calls; the server merely
# PROXIES the already-signed requests to Tanka's gateway (gw-q.tanka.ai) -- the
# browser can't reach it directly (CORS). On a confirmed scan the server reads
# the email straight from Tanka's TLS response and mints the usual app tokens.
# ON by default -- GET /tanka/verify advertises it so the web login shows a
# "Continue with Tanka" button; the button opens a QR the user scans with the
# Tanka app. Set TANKA_LOGIN_ENABLED: false to disable it (the button then hides
# and the /tanka/* + signer routes 404). Note: while on, the signer auto-discovery
# below runs `node` at boot + on a timer -- set TANKA_WASM_AUTODISCOVER: false (or
# disable Tanka) if you don't want that.
# TANKA_LOGIN_ENABLED: true
#
# Tanka's signing WASM is bridged, not vendored: the server fetches it from
# Tanka's CDN (server-side -- the CDN only allows Origin g.tanka.ai), caches it
# under <tempdir>, and serves it at /tanka-sign.wasm + the matching wasm-bindgen
# glue at /tanka-signer.js, which the browser loads.
#
# Self-healing (auto-discovery): at boot and every TANKA_WASM_REFRESH_INTERVAL
# seconds, the server runs the Node discovery engine res/tanka/discover.cjs, which
# finds Tanka's live signer build and VERIFIES it (signs a real create-QR; Tanka
# must answer code:0), then adopts it in memory -- swapping the served glue + WASM
# in lockstep. This needs `node` on PATH (installed in the runtime image). If node
# or Tanka is unavailable, or nothing verifies, the server logs and keeps the
# PINNED fallback build (the committed htdoc/static/tanka-signer.js + the
# kTankaWasmPath constant in src/user/tanka.cpp), so login still works. An ABI
# change (different get_http_header arg count) is NOT auto-adopted -- it needs
# htdoc/src/tanka.js updated + rebuilt; the server logs and keeps the pin.
# TANKA_WASM_AUTODISCOVER: true
# TANKA_WASM_REFRESH_INTERVAL: 604800           # 7 days, in seconds
# TANKA_NODE_BIN: 'node'                         # node executable (PATH name or absolute)
#
# To refresh the committed PINNED fallback yourself (e.g. before disabling
# auto-discovery), run `node res/tanka/discover.cjs --write` -- it verifies the live
# build and writes the glue + kTankaWasmPath to disk; then `npm run build` in htdoc/
# and rebuild the server.
#
# Tanka's web-client origin: pinned as the Origin header on every gateway call
# (Tanka only accepts it), used as the host the signing WASM is fetched from, and
# the base auto-discovery scrapes. The gateway base and the forward paths are
# likewise overridable. Override these only to point tests at a mock.
# TANKA_WEB_ORIGIN: 'https://g.tanka.ai'
# TANKA_API_BASE: 'https://gw-q.tanka.ai'

