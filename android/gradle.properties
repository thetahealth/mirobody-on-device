org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false

# Disable AGP's built-in Kotlin so the explicit org.jetbrains.kotlin.android plugin
# in app/build.gradle.kts can apply without colliding on the `kotlin` extension.
android.builtInKotlin=false

# Keep the legacy android {} DSL (BaseExtension) so the Kotlin Android plugin can
# still cast to it. The new DSL registers ApplicationExtensionImpl and breaks Kotlin 2.2.x.
android.newDsl=false
